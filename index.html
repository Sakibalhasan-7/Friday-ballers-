<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friday Football Club - Live App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; background-color: #0b1329; color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 shadow-xl">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-emerald-500 text-slate-950 p-2.5 rounded-xl font-bold text-xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-futbol"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">Friday Football Club</h1>
                    <p class="text-xs text-slate-400">Live Cross-Device Tracker</p>
                </div>
            </div>
            
            <button id="adminBtn" onclick="openAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs px-3.5 py-2 rounded-xl flex items-center gap-2 transition">
                <i class="fa-solid fa-lock" id="adminIcon"></i>
                <span id="adminText">Admin Mode</span>
            </button>
        </div>
    </header>

    <!-- Admin Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i> Admin Login
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">Password Din (PIN: 1234):</p>
            <input type="password" id="adminPassInput" placeholder="Enter PIN" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
            <p id="errorMsg" class="text-xs text-rose-500 hidden">Wrong PIN! Try again.</p>
            <div class="flex gap-2">
                <button onclick="closeAdminModal()" class="flex-1 bg-slate-800 text-slate-300 py-2 rounded-xl text-xs font-semibold">Cancel</button>
                <button onclick="submitAdminPass()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2 rounded-xl text-xs transition">Unlock</button>
            </div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-4 py-6 space-y-8">

        <!-- Admin Active Banner -->
        <div id="adminBanner" class="hidden bg-emerald-950/60 border border-emerald-500/40 rounded-2xl p-4 flex justify-between items-center text-sm text-emerald-300">
            <span><i class="fa-solid fa-circle-check mr-2"></i> Admin Mode Active! Real-time sync enabled.</span>
            <button onclick="logoutAdmin()" class="text-xs bg-rose-500/20 text-rose-300 border border-rose-500/30 px-3 py-1 rounded-lg">Logout</button>
        </div>

        <!-- Section 1: Leaderboard -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-ranking-star text-amber-400"></i> Player Leaderboard (Live)
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-950 text-slate-400 text-xs uppercase border-b border-slate-800">
                        <tr>
                            <th class="py-3 px-3">Player</th>
                            <th class="py-3 px-3">Position</th>
                            <th class="py-3 px-3 text-center">Goals</th>
                            <th class="py-3 px-3 text-center">Assists</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody" class="divide-y divide-slate-800">
                        <tr><td colspan="4" class="text-center py-4 text-xs text-slate-500">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Section 2: Player Profiles -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-users text-emerald-400"></i> Squad & Bio
            </h2>

            <!-- Add Player Form -->
            <div id="addPlayerCard" class="hidden bg-slate-950/80 border border-slate-800 p-4 rounded-xl mb-6">
                <h3 class="text-sm font-bold text-emerald-400 mb-3">+ Add New Player</h3>
                <form id="playerForm" class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="pName" placeholder="Player Name" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required>
                    <select id="pPos" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                        <option value="Attacker">Attacker</option>
                        <option value="Midfielder">Midfielder</option>
                        <option value="Defender">Defender</option>
                        <option value="Goalkeeper">Goalkeeper</option>
                    </select>
                    <input type="url" id="pPhoto" placeholder="Photo Image URL (Optional)" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    <button type="submit" class="md:col-span-3 bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-sm">Save Player</button>
                </form>
            </div>

            <div id="playersGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </section>

        <!-- Section 3: Match Results -->
        <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-400"></i> Match Results
            </h2>

            <!-- Add Match Form -->
            <div id="addMatchCard" class="hidden bg-slate-950/80 border border-slate-800 p-4 rounded-xl mb-6 space-y-3">
                <h3 class="text-sm font-bold text-amber-400">+ Add Match Result</h3>
                <form id="matchForm" class="space-y-3">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="date" id="mDate" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required>
                        <input type="text" id="mWinner" placeholder="Winner Team (e.g. Team Red)" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required>
                        <input type="text" id="mScore" placeholder="Score (e.g. 4 - 2)" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" required>
                        <input type="url" id="mPhoto" placeholder="Match Photo Image URL (Optional)" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
                    </div>
                    <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-2 rounded-xl text-sm">Save Match</button>
                </form>
            </div>

            <div id="matchesList" class="space-y-4"></div>
        </section>

    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDUbCWel8FzP-jGq3aDd-KV7QRV1BpfPKI",
            authDomain: "friday-football-516c4.firebaseapp.com",
            projectId: "friday-football-516c4",
            storageBucket: "friday-football-516c4.firebasestorage.app",
            messagingSenderId: "316532261804",
            appId: "1:316532261804:web:3a994420a0c59637c1f009",
            databaseURL: "https://friday-football-516c4-default-rtdb.firebaseio.com"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let isAdmin = false;
        let players = [];
        let matches = [];

        db.ref('players').on('value', snapshot => {
            const data = snapshot.val();
            players = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderPlayers();
            renderLeaderboard();
        }, err => console.error(err));

        db.ref('matches').on('value', snapshot => {
            const data = snapshot.val();
            matches = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse() : [];
            renderMatches();
        }, err => console.error(err));

        function openAdminModal() {
            if(isAdmin) { logoutAdmin(); return; }
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('errorMsg').classList.add('hidden');
            document.getElementById('adminPassInput').value = '';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function submitAdminPass() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === "1234") {
                isAdmin = true;
                closeAdminModal();
                updateAdminUI();
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            updateAdminUI();
        }

        function updateAdminUI() {
            if (isAdmin) {
                document.getElementById('adminBanner').classList.remove('hidden');
                document.getElementById('addPlayerCard').classList.remove('hidden');
                document.getElementById('addMatchCard').classList.remove('hidden');
                document.getElementById('adminText').innerText = "Admin (Active)";
                document.getElementById('adminIcon').className = "fa-solid fa-unlock text-emerald-400";
            } else {
                document.getElementById('adminBanner').classList.add('hidden');
                document.getElementById('addPlayerCard').classList.add('hidden');
                document.getElementById('addMatchCard').classList.add('hidden');
                document.getElementById('adminText').innerText = "Admin Mode";
                document.getElementById('adminIcon').className = "fa-solid fa-lock";
            }
            renderPlayers();
        }

        document.getElementById('playerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('pName').value.trim();
            const pos = document.getElementById('pPos').value;
            const photoInput = document.getElementById('pPhoto').value.trim();

            let photoUrl = photoInput || ('https://ui-avatars.com/api/?background=0D9488&color=fff&name=' + encodeURIComponent(name));
            savePlayerToDB(name, pos, photoUrl);
        });

        function savePlayerToDB(name, pos, photo) {
            db.ref('players').push({ name, pos, goals: 0, assists: 0, photo });
            document.getElementById('playerForm').reset();
        }

        function renderPlayers() {
            const grid = document.getElementById('playersGrid');
            grid.innerHTML = players.length ? '' : '<p class="text-slate-500 text-xs col-span-full text-center">No players added yet.</p>';
            players.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between shadow-md">
                        <div class="flex items-center gap-3">
                            <img src="${p.photo}" class="w-12 h-12 rounded-full object-cover border-2 border-emerald-500" onerror="this.src='https://ui-avatars.com/api/?background=0D9488&color=fff&name=${encodeURIComponent(p.name)}'">
                            <div>
                                <h4 class="font-bold text-white text-sm">${p.name}</h4>
                                <span class="text-[10px] bg-emerald-950 text-emerald-400 px-2 py-0.5 rounded-md border border-emerald-800/50">${p.pos}</span>
                            </div>
                        </div>
                        ${isAdmin ? `
                            <div class="flex items-center gap-1">
                                <button onclick="updateGoal('${p.id}',${p.goals + 1})" class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded text-xs font-bold">+1 G</button>
                                <button onclick="deletePlayer('${p.id}')" class="text-rose-500 hover:text-rose-400 text-xs px-2"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
        }

        function updateGoal(id, newGoals) {
            db.ref('players/' + id).update({ goals: newGoals });
        }

        function deletePlayer(id) {
            if(confirm("Delete player?")) db.ref('players/' + id).remove();
        }

        function renderLeaderboard() {
            const body = document.getElementById('leaderboardBody');
            body.innerHTML = '';
            if(!players.length) {
                body.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-xs text-slate-500">No data available</td></tr>';
                return;
            }
            let sorted = [...players].sort((a, b) => b.goals - a.goals);
            sorted.forEach(p => {
                body.innerHTML += `
                    <tr class="hover:bg-slate-950/50">
                        <td class="py-3 px-3 flex items-center gap-2">
                            <img src="${p.photo}" class="w-7 h-7 rounded-full object-cover" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}'">
                            <span class="font-semibold text-white">${p.name}</span>
                        </td>
                        <td class="py-3 px-3 text-xs text-slate-400">${p.pos}</td>
                        <td class="py-3 px-3 text-center font-bold text-emerald-400">${p.goals}</td>
                        <td class="py-3 px-3 text-center font-bold text-amber-400">${p.assists || 0}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('matchForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const date = document.getElementById('mDate').value;
            const winner = document.getElementById('mWinner').value.trim();
            const score = document.getElementById('mScore').value.trim();
            const photoInput = document.getElementById('mPhoto').value.trim();

            saveMatchToDB(date, winner, score, photoInput || null);
        });

        function saveMatchToDB(date, winner, score, photo) {
            db.ref('matches').push({ date, winner, score, photo });
            document.getElementById('matchForm').reset();
        }

        function renderMatches() {
            const list = document.getElementById('matchesList');
            list.innerHTML = matches.length ? '' : '<p class="text-slate-500 text-xs text-center">No match history found.</p>';
            matches.forEach(m => {
                list.innerHTML += `
                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div class="space-y-1 text-center md:text-left">
                            <span class="text-xs text-slate-400"><i class="fa-regular fa-calendar mr-1"></i>${m.date}</span>
                            <h3 class="text-base font-bold text-amber-400">🏆 Winner: ${m.winner}</h3>
                            <p class="text-sm font-semibold text-white">Score: ${m.score}</p>
                        </div>
                        ${m.photo ? `<img src="${m.photo}" class="w-full md:w-36 h-24 rounded-lg object-cover border border-slate-700">` : ''}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
